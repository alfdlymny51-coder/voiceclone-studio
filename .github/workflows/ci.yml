name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest httpx
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JS
        run: node --check frontend/js/app.js

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f deploy/Dockerfile.backend -t vcs:test .
